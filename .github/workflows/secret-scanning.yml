name: Secret Scanning

# Why this exists
# ---------------
# On 2026-09-17 the secret-scanning gate in Gray-Ghost-Data-Consultants-LLC/the-system
# was found to have been inert for months: its .gitleaks.toml declared an [allowlist]
# but no [[rules]] and no `useDefault`, and gitleaks run with such a config loads ZERO
# rules and reports "no leaks found" for everything. Every green run was vacuous.
# This repository had no secret scanning at all. Both gaps close the same way: run the
# scanner, and prove every run that the scanner can still fail (see the canary step).
# Incident: ~/Business/docs/operations/incidents/INC-2026-09-17-gitleaks-vacuous/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the entire history instead of only the new commits'
        type: boolean
        default: true

concurrency:
  group: secret-scanning-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.4"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m); case "$ARCH" in x86_64|amd64) ARCH=x64;; arm64|aarch64) ARCH=arm64;; esac
          mkdir -p "$RUNNER_TEMP/bin"
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # Canary — assert the scanner can still detect anything at all.
      # A scanner that has never failed is indistinguishable from one that CANNOT
      # fail. Plant two synthetic credentials in a temp directory outside the
      # checkout, scan them with THIS repository's own configuration, and fail the
      # job if they are not found. If someone later adds a .gitleaks.toml with an
      # allowlist and no `useDefault`, this shouts instead of going quietly green.
      # The planted values are generated at run time, so this file never contains
      # a credential-shaped literal of its own.
      - name: Canary — the config must still detect a planted credential
        run: |
          set -euo pipefail
          CANARY="$RUNNER_TEMP/gitleaks-canary"
          rm -rf "$CANARY"; mkdir -p "$CANARY"
          if [ -f .gitleaks.toml ]; then cp .gitleaks.toml "$CANARY/.gitleaks.toml"; fi
          # The token bodies are generated at run time, so this file holds no
          # credential-shaped literal of its own -- and the canary is a different
          # value every run, which no allowlist can quietly learn.
          TOKEN_A="$(openssl rand -hex 18)"
          TOKEN_B="$(openssl rand -hex 12)"
          {
            printf 'const a = "%s_%s";\n' 'ghp' "$TOKEN_A"
            printf 'const b = "%s_%s_%s";\n' 'sk' 'live' "$TOKEN_B"
          } > "$CANARY/planted.ts"
          if gitleaks detect --source "$CANARY" --no-git --redact --no-banner; then
            echo "::error::Secret scanning is INERT — gitleaks found none of the planted credentials."
            echo "::error::If this repo has a .gitleaks.toml, check it declares [extend] useDefault = true."
            exit 1
          fi
          echo "Canary detected as expected — the ruleset is live."
          rm -rf "$CANARY"

      # Scope: the commits this change ADDS, not the whole history. A full-history
      # scan would put a red X on every PR for findings nobody in that PR wrote,
      # which is how a gate gets switched off again. Use workflow_dispatch for the
      # full-history audit.
      - name: Gitleaks scan
        id: scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FULL_HISTORY: ${{ github.event.inputs.full_history }}
        run: |
          set +e
          ZERO="0000000000000000000000000000000000000000"
          SCOPE=""
          if [ "$FULL_HISTORY" != "true" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$PR_BASE_SHA" ] \
              && git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              SCOPE="--log-opts=$PR_BASE_SHA..HEAD"
            elif [ "${{ github.event_name }}" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] \
              && [ "$PUSH_BEFORE_SHA" != "$ZERO" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              SCOPE="--log-opts=$PUSH_BEFORE_SHA..HEAD"
            fi
          fi
          echo "Scan scope: ${SCOPE:-full history}"
          gitleaks detect --source . --verbose --redact --no-banner $SCOPE
          CODE=$?
          if [ "$CODE" -eq 1 ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
            if [ "$CODE" -ne 0 ]; then
              echo "::warning::Gitleaks exited $CODE — a scanner failure, not a detection."
            fi
          fi
          # This step never fails on a detection; the next step decides. That keeps
          # this job's own red/green conclusion meaningful, instead of the
          # continue-on-error pattern where a green job hides a real finding.
          exit 0

      # Fails for push AND pull_request alike. A detection on the default branch
      # that only shows up as a skipped step is a detection nobody sees.
      - name: Fail if a secret was detected
        if: steps.scan.outputs.detected == 'true'
        run: |
          echo "::error::Secret detected in these commits. Remove it and ROTATE the credential —"
          echo "::error::deleting the file is not enough, the blob stays reachable in history."
          exit 1
